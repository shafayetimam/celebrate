<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Linear Clock Widget</title>
<style>
  :root { --bg:#e9e6e0; --cap:#777; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg:#111; --cap:#999; }
  }
  :root[data-theme="dark"] { --bg:#111; --cap:#999; }
  body { margin:0; padding:32px 16px; background:var(--bg); font-family:-apple-system, system-ui, sans-serif;
         display:flex; flex-wrap:wrap; gap:24px; justify-content:center; align-items:flex-start; }
  .w { border-radius:22px; overflow:hidden; box-shadow:0 6px 24px rgba(0,0,0,.25);
       background:linear-gradient(#8c929b, #61666f); }
  canvas { display:block; max-width:100%; }
  .cap { text-align:center; font-size:12px; color:var(--cap); margin-top:8px; }
</style>
</head>
<body>
  <div><div class="w"><canvas data-w="170" data-h="170" data-rows="small"></canvas></div><div class="cap">Small</div></div>
  <div><div class="w"><canvas data-w="364" data-h="170" data-rows="medium"></canvas></div><div class="cap">Medium</div></div>
  <div><div class="w"><canvas data-w="364" data-h="382" data-rows="large"></canvas></div><div class="cap">Large</div></div>
<script>
// Same geometry as LEDBar in LinearClockWidget.swift.
const S = { lit:'#0dd666', litTop:'#52ff99', unlit:'#21141a', label:'#f7edfa' };
const ROWS = {
  small:  [[0,12,1,1,'h'], [12,24,1,1,'h']],
  medium: [[0,24,.5,1,'h'], [0,60,2.5,5,'m']],
  large:  [[0,12,.5,1,'h'], [12,24,.5,1,'h'], [0,60,2.5,5,'m']],
};
const GAP = { small:10, medium:10, large:14 };

function bar(ctx, X, Y, W, H, start, end, seg, every, value) {
  const units = end - start, spacing = W / units * every;
  const fs = Math.min(H * .24, spacing * .85), inset = fs * .45, w = W - inset * 2;
  const count = Math.round(units / seg), step = w / count;
  const x = u => X + inset + (u - start) / units * w;
  const lb = Y + fs * 1.05, longTop = lb + fs * .15, shortTop = lb + fs * .38, tb = lb + fs * .65, segTop = tb + fs * .35;

  ctx.strokeStyle = S.label; ctx.fillStyle = S.label;
  ctx.font = `500 ${fs * 1.08}px -apple-system, system-ui, sans-serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  for (let i = 0; i <= count; i++) {
    const u = start + i * seg, r = u / every, isLabel = Math.abs(Math.round(r) - r) < .001, px = x(u);
    ctx.lineWidth = isLabel ? 1.4 : 1;
    ctx.beginPath(); ctx.moveTo(px, isLabel ? longTop : shortTop); ctx.lineTo(px, tb); ctx.stroke();
    if (isLabel) { ctx.save(); ctx.translate(px, lb - fs * .05); ctx.scale(.62, 1); ctx.fillText(String(Math.round(u)), 0, 0); ctx.restore(); }
  }
  const gap = Math.max(1, step * .24);
  for (let i = 0; i < count; i++) {
    const u = start + i * seg, rx = x(u) + gap / 2, rw = step - gap, rh = Y + H - segTop;
    if (u < value) {
      const g = ctx.createLinearGradient(0, segTop, 0, segTop + rh);
      g.addColorStop(0, S.litTop); g.addColorStop(1, S.lit);
      ctx.save(); ctx.shadowColor = 'rgba(13,214,102,.75)'; ctx.shadowBlur = Math.max(4, step);
      ctx.fillStyle = g; ctx.fillRect(rx, segTop, rw, rh); ctx.restore();
    } else { ctx.fillStyle = S.unlit; ctx.fillRect(rx, segTop, rw, rh); }
  }
}

function draw(cv, now) {
  const W = +cv.dataset.w, H = +cv.dataset.h, dpr = devicePixelRatio || 1;
  if (cv.width !== W * dpr) { cv.width = W * dpr; cv.height = H * dpr; cv.style.width = W + 'px'; cv.style.height = H + 'px'; }
  const ctx = cv.getContext('2d'); ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, W, H);
  // glass display
  ctx.fillStyle = '#050505'; ctx.beginPath(); ctx.roundRect(9, 9, W - 18, H - 18, 14); ctx.fill();
  const hours = now.getHours() + now.getMinutes() / 60 + now.getSeconds() / 3600;
  const minutes = now.getMinutes() + now.getSeconds() / 60;
  const kind = cv.dataset.rows, rows = ROWS[kind], gap = GAP[kind];
  const x0 = 19, y0 = 21, iw = W - 38, ih = H - 42, rh = (ih - gap * (rows.length - 1)) / rows.length;
  rows.forEach(([s, e, seg, every, unit], i) =>
    bar(ctx, x0, y0 + i * (rh + gap), iw, rh, s, e, seg, every, unit === 'h' ? hours : minutes));
}

const params = new URLSearchParams(location.search);
function tick() {
  const now = params.get('t') ? new Date(params.get('t')) : new Date();
  document.querySelectorAll('canvas').forEach(c => draw(c, now));
}
tick(); setInterval(tick, 1000);
</script>
</body>
</html>
